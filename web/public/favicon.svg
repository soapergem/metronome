<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <!-- Minimalist Metronome Housing in sky-400 (#38bdf8) -->
  <path d="M 18 54 L 26 14 C 26.3 12.8 27.3 12 28.5 12 L 35.5 12 C 36.7 12 37.7 12.8 38 14 L 46 54" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Base Ground Bar -->
  <line x1="14" y1="54" x2="50" y2="54" stroke="#38bdf8" stroke-width="3" stroke-linecap="round"/>

  <!-- Lower Horizon Crossbar -->
  <line x1="20" y1="46" x2="44" y2="46" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Pendulum Arm / Eighth Note Stem -->
  <line x1="32" y1="48" x2="46" y2="7" stroke="#38bdf8" stroke-width="3" stroke-linecap="round"/>

  <!-- Compact Eighth Note Flag (Clear separation above notehead) -->
  <path d="M 46 7 C 52 9 55 13 52 17 C 50 19 48 19.5 45.5 19 C 48.5 15 48.5 11 46 9 Z" fill="#38bdf8"/>

  <!-- Eighth Notehead as the Sliding Metronome Bob Weight -->
  <ellipse cx="38" cy="28" rx="5" ry="3.5" transform="rotate(-25 38 28)" fill="#38bdf8"/>

  <!-- Bottom Pivot Point -->
  <circle cx="32" cy="48" r="3" fill="#38bdf8"/>
</svg>
